<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reactor Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7ecf2; --surface:#ffffff; --paper:#fbfaf5; --ink:#17202c; --muted:#566476; --line:#d0d8e2;
  --hazard:#f5c400; --hazard-edge:#a88600; --cyan:#13b3c4; --alarm:#ff4d4d; --safe:#2fbf71;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e141e; --surface:#18212e; --paper:#1a2330; --ink:#e6ecf3; --muted:#9ba9bb; --line:#2b3748; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e141e; --surface:#18212e; --paper:#1a2330; --ink:#e6ecf3; --muted:#9ba9bb; --line:#2b3748; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:26px}
.stack .btn{width:min(360px,100%)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:58px;padding:0 1.4em;border-radius:12px;font-weight:700;font-size:1.1rem;background:var(--hazard);color:#17202c;box-shadow:0 4px 0 var(--hazard-edge);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--hazard-edge)}
.btn.secondary{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{min-height:48px;font-size:1rem;padding:0 1em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:10px;color:var(--ink)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#121a26;color:#fff;padding:10px 16px}
.bar .meta{display:flex;gap:14px;flex-wrap:wrap;font-weight:700;font-size:.95rem}
.bar .meta strong{font-family:"Chakra Petch",sans-serif;letter-spacing:.08em}
.bar .spacer{flex:1}
.bar .clock-mini{font-family:"Chakra Petch",sans-serif;font-size:1.4rem;color:#5ef0ff;min-width:3.2em;text-align:right}
.bar .clock-mini.low{color:var(--alarm)}
.bar button{color:#fff;font-weight:700;font-size:.95rem;padding:8px 10px;border-radius:8px}
.bar button:hover{background:rgba(255,255,255,.12)}

.core{width:180px;height:180px;margin:24px auto 0;border-radius:50%;position:relative;
  background:radial-gradient(circle,#c8fbff 0 14%,#4fe3f0 15% 30%,#0f7f8f 31% 34%,transparent 35%),
             repeating-radial-gradient(circle,transparent 0 22px,rgba(19,179,196,.35) 22px 24px);
  box-shadow:0 0 60px rgba(79,227,240,.45)}
.core::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:8px solid transparent;
  background:repeating-conic-gradient(var(--hazard) 0 10deg,transparent 10deg 30deg) border-box;
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.title{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(46px,10vw,84px);line-height:1;margin:22px 0 10px;letter-spacing:.02em}
.lead{max-width:34em;margin:0 auto;color:var(--muted);font-size:1.1rem}

.levels{display:grid;gap:14px;max-width:540px;margin:24px auto 0}
.level{display:flex;align-items:center;gap:16px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 4px 0 var(--line)}
.level .badge{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:15px;letter-spacing:.1em;padding:10px 12px;border-radius:10px;background:#121a26;color:var(--hazard);flex:none;min-width:110px;text-align:center}
.level b{display:block;font-size:1.15rem}
.level small{color:var(--muted);font-size:1rem}

.bigcode{display:inline-block;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(64px,18vw,118px);letter-spacing:.12em;line-height:1.1;background:#121a26;color:#5ef0ff;padding:.08em .35em .08em .47em;border-radius:16px;box-shadow:0 0 0 4px var(--hazard);margin:18px 0 12px}
.codeinput{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:60px;letter-spacing:.15em;width:min(320px,100%);text-align:center;padding:10px;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--ink)}
.codeinput:focus{outline:none;border-color:var(--cyan)}
.error{color:var(--alarm);font-weight:700;min-height:1.5em;margin:8px 0 0}

.role{display:inline-block;padding:.3em .95em;border-radius:999px;font-weight:700;font-size:1rem}
.role.operator{background:#0f7f8f;color:#fff}
.role.expert{background:var(--hazard);color:#17202c}
.rolecard{max-width:580px;margin:22px auto 0;background:var(--surface);border-radius:16px;padding:22px;border:3px solid var(--line);text-align:left}
.rolecard.operator{border-color:#0f7f8f}
.rolecard.expert{border-color:var(--hazard)}
.rolecard h2{margin:.25em 0 .3em;font-size:1.6rem}
.rolecard p{margin:.45em 0}
.roundno{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(34px,7vw,52px);margin:10px 0 0;line-height:1.1}

/* ===== operator console ===== */
.console{background:linear-gradient(#263347,#1c2635);border-radius:18px;padding:14px;color:#dfe8f3;box-shadow:inset 0 0 0 2px #3a4a60,0 10px 30px rgba(0,0,0,.2)}
.console.alarm{animation:alarm .45s 3}
@keyframes alarm{50%{box-shadow:inset 0 0 0 5px var(--alarm),0 0 50px rgba(255,77,77,.7)}}
.hazard{height:12px;border-radius:6px;background:repeating-linear-gradient(-45deg,#f5c400 0 12px,#1b1f27 12px 24px);margin-bottom:12px}
.toprow{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.plate{flex:1 1 220px;color:#1a2230;border-radius:10px;padding:10px 18px;
  background:
    radial-gradient(circle at 10px 10px,#5d6878 2.5px,transparent 3.2px),
    radial-gradient(circle at calc(100% - 10px) 10px,#5d6878 2.5px,transparent 3.2px),
    radial-gradient(circle at 10px calc(100% - 10px),#5d6878 2.5px,transparent 3.2px),
    radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#5d6878 2.5px,transparent 3.2px),
    linear-gradient(#d3dae3,#9ea9b7)}
.plate .lbl{font-family:"Chakra Petch",sans-serif;font-size:12px;letter-spacing:.14em;opacity:.7}
.plate .model{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:30px;letter-spacing:.14em;line-height:1.1}
.plate .serial{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:20px;letter-spacing:.22em}
.strikes{display:flex;flex-direction:column;justify-content:center;gap:6px;background:#121923;border-radius:10px;padding:10px 14px}
.strikes .lbl,.clockbox .lbl{font-family:"Chakra Petch",sans-serif;font-size:12px;letter-spacing:.14em;color:#8fa2ba}
.strikes .leds{display:flex;gap:8px}
.led{width:22px;height:22px;border-radius:50%;background:#3a2328;box-shadow:inset 0 0 0 2px #52303a}
.led.on{background:var(--alarm);box-shadow:0 0 12px var(--alarm)}
.clockbox{background:#0b1018;border-radius:10px;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end}
.clock{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:40px;color:#5ef0ff;line-height:1;min-width:3.4em;text-align:right}
.clock.low{color:var(--alarm)}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-top:12px}
.module{background:#2b394d;border-radius:14px;padding:12px;box-shadow:inset 0 0 0 2px #3c4d66}
.module h3{margin:0 0 10px;font-family:"Chakra Petch",sans-serif;font-size:15px;letter-spacing:.14em;color:#b3c4d8;display:flex;align-items:center;gap:8px}
.module h3 .unitcode{background:#d3dae3;color:#1a2230;border-radius:5px;padding:2px 8px;letter-spacing:.12em}
.module h3 .st{margin-left:auto;font-size:12px;letter-spacing:.12em;display:flex;align-items:center;gap:6px;color:#7f8ea3}
.module h3 .st i{width:14px;height:14px;border-radius:50%;background:#4a2a2f;display:inline-block}
.module.stable{box-shadow:inset 0 0 0 3px var(--safe)}
.module.stable h3 .st{color:var(--safe)}
.module.stable h3 .st i{background:var(--safe);box-shadow:0 0 10px var(--safe)}
.module.stable .controls{opacity:.55;pointer-events:none}
.cbtn{font-family:"Chakra Petch",sans-serif;font-weight:700;letter-spacing:.08em;background:#43567a;color:#fff;border-radius:10px;min-height:48px;padding:0 16px;box-shadow:0 4px 0 #18202c}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #18202c}
.cbtn.warn{background:var(--hazard);color:#17202c;box-shadow:0 4px 0 var(--hazard-edge)}
.cbtn:disabled{opacity:.4;cursor:not-allowed}
.wirebox{background:#5d6a80;border-radius:10px;box-shadow:inset 0 0 0 2px #45556e}
.wirebox svg{display:block;width:100%;height:auto}
.wirebox g[data-act]{cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row .grow{flex:1}
.testled{width:24px;height:24px;border-radius:50%;background:#2a3140;box-shadow:inset 0 0 0 2px #46516b;flex:none}
.testled.steady{background:#ffb02e;box-shadow:0 0 14px #ffb02e}
.testled.pulsing{background:#ffb02e;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{background:#2a3140;box-shadow:inset 0 0 0 2px #46516b}}
.lamp{width:52px;height:52px;border-radius:50%;margin:0 auto 10px;background:currentColor;box-shadow:0 0 24px currentColor,inset 0 -6px 10px rgba(0,0,0,.25)}
.lamp.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;box-shadow:none}}
.bank{display:flex;flex-direction:column;gap:8px;background:#151d29;border-radius:10px;padding:10px}
.bank.bottom .hazardbar{order:2}
.hazardbar{height:14px;border-radius:4px;background:repeating-linear-gradient(-45deg,#f5c400 0 9px,#1b1f27 9px 18px)}
.bankrow{display:flex;align-items:center;gap:10px}
.bankrow.right{flex-direction:row-reverse}
.gauge{width:46px;height:46px;border-radius:50%;flex:none;position:relative;background:radial-gradient(circle,#e9eef4 0 60%,#9aa6b6 61%);box-shadow:inset 0 0 0 3px #5b6779}
.gauge::before{content:"";position:absolute;inset:6px;border-radius:50%;background:conic-gradient(from 200deg,#2fbf71 0 90deg,#ffb02e 90deg 130deg,#ff4d4d 130deg 160deg,transparent 160deg);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.gauge i{position:absolute;left:50%;top:50%;width:3px;height:17px;background:#1a2230;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(35deg);border-radius:2px}
.levers{flex:1;display:flex;justify-content:space-around;gap:6px}
.lever{width:46px;height:96px;border-radius:12px;background:#0d131c;box-shadow:inset 0 0 0 2px #45556e;position:relative}
.lever::before{content:"";position:absolute;left:50%;top:12px;bottom:12px;width:6px;transform:translateX(-50%);background:#2c3a4f;border-radius:3px}
.lever::after{content:"";position:absolute;left:8px;right:8px;height:34px;border-radius:8px;background:linear-gradient(#eef2f7,#9eabbb);transition:top .12s}
.lever.up::after{top:7px}
.lever.down::after{top:55px}
.display{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:38px;letter-spacing:.4em;background:#0b1018;color:#5ef0ff;border-radius:10px;text-align:center;padding:6px 0 6px .4em}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.keypad .cbtn{min-height:52px;font-size:20px}

/* ===== manual ===== */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.toc a{font-weight:700;color:var(--ink);text-decoration:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.95rem}
.manual{background:var(--paper);border:1px solid var(--line);border-radius:6px;max-width:780px;margin:0 auto;padding:26px 24px 30px;font-size:19px;line-height:1.55;box-shadow:0 3px 0 var(--line)}
.manual h1{font-family:"Chakra Petch",sans-serif;font-size:30px;line-height:1.15;margin:0}
.manual .edition{color:var(--muted);margin:4px 0 0}
.manual h2{font-family:"Chakra Petch",sans-serif;font-size:23px;margin:30px 0 8px;padding-top:12px;border-top:3px solid var(--ink);scroll-margin-top:80px}
.manual h3{font-family:"Chakra Petch",sans-serif;font-size:19px;margin:20px 0 4px;scroll-margin-top:80px}
.manual p{margin:.5em 0}
.manual .important{font-weight:700}
.manual .warning{border-left:6px solid var(--hazard);background:color-mix(in srgb,var(--hazard) 14%,transparent);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.manual table{border-collapse:collapse;margin:8px 0;max-width:100%}
.manual th,.manual td{border:1px solid var(--line);padding:5px 12px;text-align:left;vertical-align:top}
.manual th{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.manual td.cell{font-family:"Chakra Petch",sans-serif;font-weight:700;text-align:center}
.manual dl.instr{margin:8px 0}
.manual dl.instr dt{font-family:"Chakra Petch",sans-serif;font-weight:700;float:left;width:2.2em}
.manual dl.instr dd{margin:0 0 8px 2.2em}
.manual ul.terms{padding-left:1.2em}
.manual ul.terms li{margin:5px 0}
.manual .tablewrap{overflow-x:auto}
.manual .bulletin{border:2px dashed var(--line);border-radius:8px;padding:10px 14px;margin:12px 0}
.manual .bulletin h3{margin-top:0}
.manual .ico{display:inline-block;vertical-align:middle;margin:2px 6px 2px 0}
.manual td.pic{white-space:nowrap}
.manual table.terms th{white-space:nowrap}
.manual .pair{display:flex;gap:24px;flex-wrap:wrap}
.manual .code{font-family:"Chakra Petch",sans-serif;letter-spacing:.06em;font-weight:700}

.actionbar{position:sticky;bottom:0;z-index:4;margin:18px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.keyphrases{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;justify-content:center}
.keyphrases li{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:5px 11px;font-weight:700;font-size:.98rem}
.keyphrases.operator li{border-color:#0f7f8f}
.keyphrases.expert li{border-color:var(--hazard)}
.codeentry{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.codeentry label{font-weight:700}
.codeentry input{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:26px;letter-spacing:.2em;width:5.2em;text-align:center;padding:6px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.codeentry input:focus{outline:none;border-color:var(--cyan)}

.big{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(44px,10vw,74px);margin:16px 0 6px;line-height:1.05}
.big.good{color:var(--safe)}
.boom{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(56px,14vw,104px);line-height:1;display:inline-block;padding:46px 40px;margin:10px 0;color:#17202c;
  background:radial-gradient(circle,#fff3a8 0 30%,#ffb02e 31% 50%,#ff6a3d 51% 62%,transparent 63%);transform:rotate(-6deg)}
.stars{font-size:48px;letter-spacing:.1em;color:#e9a800;line-height:1.2}
.stars .empty{color:var(--line)}
.type3{max-width:30em;margin:12px auto;font-size:1.25rem;font-weight:700;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 18px}
.scoretable{margin:16px auto 0;border-collapse:collapse;font-size:1.05rem}
.scoretable td{padding:6px 14px;border-bottom:1px solid var(--line);text-align:left}
.scoretable td.s{color:#e9a800;letter-spacing:.1em}
.total{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:72px;line-height:1;margin:10px 0 0}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,12,20,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.panel{background:var(--surface);color:var(--ink);border-radius:18px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 10px;font-size:1.5rem}
.panel ol{padding-left:1.3em}
.panel ol li{margin:8px 0}
.panel .close{margin-top:18px;width:100%}
.panel .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.panel .btnrow .btn{flex:1 1 180px}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#121a26;color:#fff;font-weight:700;padding:12px 20px;border-radius:12px;z-index:30;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.bad{background:var(--alarm)}
.toast.good{background:var(--safe)}
@media (prefers-reduced-motion:reduce){
  .console.alarm{animation:none;box-shadow:inset 0 0 0 5px var(--alarm)}
  .btn,.cbtn,.lever::after{transition:none}
}
@media (max-width:520px){
  .manual{padding:18px 14px 24px;font-size:18px}
  .clock{font-size:32px}
  .plate .model{font-size:24px}
  .lever{width:38px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>

<script>
/* =====================================================================
   EDIT HERE  –  settings and short texts
   ===================================================================== */
const CONFIG = {
  roundsPerGame: 2,             // reactors per game (players swap roles after each reactor)
  germanPenaltySeconds: 20,     // "Oops, German!" costs this many seconds
  stars: [3, 2, 1],             // stars for 0, 1, 2 mistakes
  levels: {
    1: { name: "Cadet",    info: "One version of each unit, terms explained where you need them, glossary",
         seconds: 420, maxStrikes: 3, wires: [4, 5], models: ["Helios"], wireUnits: ["K-12"], regUnits: ["R-20"], bulletins: false },
    2: { name: "Engineer", info: "Two versions of each unit, separate terminology, service bulletins",
         seconds: 480, maxStrikes: 3, wires: [4, 6], models: ["Helios", "Orion"], wireUnits: ["K-12", "K-40"], regUnits: ["R-20", "R-31"], bulletins: true }
  },
  keyPhrases: {
    operator: [
      "From top to bottom, the wires are …",
      "The … wire has got stripes.",
      "The gauge is on the left / right.",
      "The code on this unit is …"
    ],
    expert: [
      "Can you describe the … ?",
      "Where exactly is the … ?",
      "If the light pulses, …",
      "Cut the … wire."
    ]
  },
  glossary: [   // shown in the Cadet manual
    ["unit", "Baugruppe, Modul"], ["wire", "Kabel"], ["stripes", "Streifen"], ["marked", "markiert"],
    ["neither … nor", "weder … noch"], ["directly below", "direkt unter"], ["to pulse", "blinken, pulsieren"], ["steady", "gleichmäßig leuchtend"],
    ["lever", "Hebel"], ["handle", "Griff"], ["to point towards", "zeigen auf"], ["hazard marking", "Warnmarkierung"],
    ["gauge", "Messanzeige"], ["pattern", "Muster"], ["digit", "Ziffer"], ["serial number", "Seriennummer"]
  ]
};
/* ===================== END OF EDITABLE PART ===================== */

const WIRE_COLOURS = { red: "#e5484d", blue: "#3e7bfa", yellow: "#f5c400", white: "#eef1f5", black: "#14171c" };
const WIRE_POOL = ["red", "red", "blue", "blue", "yellow", "white", "black"];
const LAMP_COLOURS = { green: "#3ddc84", red: "#ff4d4d", blue: "#4da3ff", yellow: "#ffd23f" };
const LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
const ORD = ["first", "second", "third", "fourth", "fifth", "sixth"];

function hashInt(n){ n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return n >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const sameArr = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const levelOf = code => Math.floor(code / 1000);
const validCode = code => Number.isInteger(code) && code >= 1000 && code < (Object.keys(CONFIG.levels).length + 1) * 1000;

/* ---------- line severance assembly (wires) ---------- */
const LINE_TYPE = { red: "hot", yellow: "hot", blue: "cold", white: "cold", black: "neutral" };
const typ = w => LINE_TYPE[w.c];
const lastWhere = (w, f) => { let i = -1; w.forEach((x, k) => { if (f(x)) i = k; }); return i; };

/* Instruction texts and logic live together, so the manual always matches the game */
const INSTR = {
  A: { t: "Cut the first cold wire. If there is no cold wire, follow G.",
       f: (w, d) => { const i = w.findIndex(x => typ(x) === "cold"); return i >= 0 ? i : INSTR.G.f(w, d); } },
  B: { t: "Cut the last hot wire. If there is no hot wire, follow G.",
       f: (w, d) => { const i = lastWhere(w, x => typ(x) === "hot"); return i >= 0 ? i : INSTR.G.f(w, d); } },
  C: { t: "Cut the marked wire that is closest to the bottom. If there is no marked wire, follow E.",
       f: (w, d) => { const i = lastWhere(w, x => x.s); return i >= 0 ? i : INSTR.E.f(w, d); } },
  D: { t: "Cut the wire directly below the first neutral wire. If there is no neutral wire, or if it is the bottom wire, follow A.",
       f: (w, d) => { const i = w.findIndex(x => typ(x) === "neutral"); return (i < 0 || i === w.length - 1) ? INSTR.A.f(w, d) : i + 1; } },
  E: { t: "Cut the second wire from the bottom.",
       f: (w) => w.length - 2 },
  F: { t: "Run a diagnostic. If the light pulses, cut the top wire. If it is steady, follow B.",
       f: (w, d) => (d.test === "pulsing" ? 0 : INSTR.B.f(w, d)) },
  G: { t: "Cut the bottom wire.",
       f: (w) => w.length - 1 },
  H: { t: "Cut the first wire that is neither hot nor marked. If there is no such wire, follow G.",
       f: (w, d) => { const i = w.findIndex(x => typ(x) !== "hot" && !x.s); return i >= 0 ? i : INSTR.G.f(w, d); } }
};
const WIRE_TABLES = {
  "K-12": { rowHead: "Top wire", colHead: "Number of marked wires", cols: ["none", "one", "two or more"],
            cells: { hot: ["B", "C", "F"], cold: ["D", "H", "C"], neutral: ["F", "A", "E"] },
            key: w => [typ(w[0]), Math.min(2, w.filter(x => x.s).length)] },
  "K-40": { rowHead: "Bottom wire", colHead: "Diagnostic: the light …", cols: ["pulses", "is steady"],
            cells: { hot: ["H", "D"], cold: ["B", "E"], neutral: ["C", "A"] },
            key: (w, d) => [typ(w[w.length - 1]), d.test === "pulsing" ? 0 : 1] }
};
const reversedAssembly = d => d.bulletins && /(\d).*\1/.test(d.serial.replace(/[A-Z]/g, ""));
function solveWire(d){
  const rev = reversedAssembly(d);
  const w = rev ? d.wires.slice().reverse() : d.wires;
  const T = WIRE_TABLES[d.wUnit];
  const [r, c] = T.key(w, d);
  const i = INSTR[T.cells[r][c]].f(w, d);
  return rev ? w.length - 1 - i : i;
}

/* ---------- flow regulator bank (levers) ---------- */
const REG_UNITS = {
  "R-20": { levers: 4, patterns: { green: "1010", red: "0110", blue: "1101", yellow: "0001" } },
  "R-31": { levers: 5, patterns: { green: "10110", red: "01101", blue: "11010", yellow: "00111" } }
};
function solveLevers(d){       // returns physical positions from left to right, true = up
  let p = REG_UNITS[d.rUnit].patterns[d.lamp].split("").map(Number);
  if (d.pulse) p = p.reverse();
  const n = p.length, phys = new Array(n);
  for (let k = 0; k < n; k++){
    const pos = d.gauge === "left" ? k : n - 1 - k;
    const open = p[k] === 1;
    phys[pos] = d.stripe === "top" ? open : !open;
  }
  return phys;
}

/* ---------- access lock (code) ---------- */
const MODEL_TABLE = { Helios: 3, Orion: 8, Vega: 5, Atlas: 1 };
const COLOUR_TABLE = { green: 2, red: 7, blue: 4, yellow: 9 };
const letterDigit = l => (l <= "F" ? 4 : l <= "M" ? 7 : l <= "T" ? 2 : 9);
const lastDigit = d => +d.serial[5];
const CODE_RULES = {
  1: [
    { t: "Number of hot wires (no hot wires = 0)", v: d => d.wires.filter(x => typ(x) === "hot").length },
    { t: "Last digit of the serial number", v: lastDigit },
    { t: "Number of marked wires (no marked wires = 5)", v: d => d.wires.filter(x => x.s).length || 5 },
    { t: "Colour of the indicator light on the flow regulator → Table C", v: d => COLOUR_TABLE[d.lamp] }
  ],
  2: [
    { t: "Reactor model → Table A", v: d => MODEL_TABLE[d.model] },
    { t: "First letter of the serial number → Table B", v: d => letterDigit(d.serial[0]) },
    { t: "Run a diagnostic on the wire unit. If the light pulses: number of cold wires. If it is steady: number of neutral wires.", v: d => d.wires.filter(x => typ(x) === (d.test === "pulsing" ? "cold" : "neutral")).length },
    { t: "Add the last two digits of the serial number. Result bigger than 9? Use only its last digit.", v: d => (+d.serial[4] + +d.serial[5]) % 10 }
  ]
};
const solveCode = d => CODE_RULES[d.level].map(r => r.v(d)).join("");

/* ---------- reactor ---------- */
function makeReactor(code, round){
  const lv = levelOf(code), L = CONFIG.levels[lv];
  const rng = mulberry32(hashInt(code * 1009 + round * 7919));
  const pick = arr => arr[Math.floor(rng() * arr.length)];
  const model = pick(L.models);
  const ch = () => pick(LETTERS.split("")), dg = () => String(Math.floor(rng() * 10));
  const serial = ch() + ch() + dg() + ch() + dg() + dg();
  const wUnit = pick(L.wireUnits);
  const n = L.wires[0] + Math.floor(rng() * (L.wires[1] - L.wires[0] + 1));
  const wires = Array.from({ length: n }, () => ({ c: pick(WIRE_POOL), s: rng() < 0.3 }));
  const test = rng() < 0.5 ? "pulsing" : "steady";
  const rUnit = pick(L.regUnits);
  const gauge = rng() < 0.5 ? "left" : "right";
  const stripe = rng() < 0.5 ? "top" : "bottom";
  const lamp = pick(Object.keys(LAMP_COLOURS));
  const pulse = L.bulletins ? rng() < 0.5 : false;
  const d = { level: lv, bulletins: L.bulletins, model, serial, wUnit, wires, test, rUnit, gauge, stripe, lamp, pulse, levers: null };
  const target = solveLevers(d);
  for (let t = 0; t < 40; t++){ d.levers = target.map(() => rng() < 0.5); if (!sameArr(d.levers, target)) break; }
  d.solution = { wire: solveWire(d), levers: target, code: solveCode(d) };
  return d;
}
function confirmCode(code, round, strikes){
  const base = hashInt(code * 31 + round * 101 + 17) % 900;
  return ((base + strikes * 337) % 900) + 100;
}

/* ---------- small pictures for the manual ---------- */
function icoWire(c, striped){
  const col = WIRE_COLOURS[c], edge = c === "black" ? "#2a2f38" : "#0b0f16";
  const band = c === "white" || c === "yellow" ? "#1b1f27" : "#f4f6f9";
  return `<svg class="ico" width="58" height="16" viewBox="0 0 58 16" aria-hidden="true"><path d="M4 8 C 20 2, 38 14, 54 8" stroke="${edge}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M4 8 C 20 2, 38 14, 54 8" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round"/>${striped ? `<path d="M4 8 C 20 2, 38 14, 54 8" stroke="${band}" stroke-width="7" fill="none" stroke-dasharray="3 6"/>` : ""}</svg>`;
}
const icoLight = on => `<svg class="ico" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="${on ? "#ffb02e" : "#2a3140"}" stroke="#46516b" stroke-width="2"/></svg>`;
const icoTest = `<svg class="ico" width="52" height="26" viewBox="0 0 52 26" aria-hidden="true"><rect x="1" y="1" width="50" height="24" rx="6" fill="#43567a"/><text x="26" y="17.5" text-anchor="middle" font-family="Chakra Petch,Arial,sans-serif" font-weight="700" font-size="12" fill="#fff" letter-spacing="1">TEST</text></svg>`;
const icoHazard = `<svg class="ico" width="58" height="14" viewBox="0 0 58 14" aria-hidden="true"><defs><pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#1b1f27"/><rect width="6" height="12" fill="#f5c400"/></pattern></defs><rect width="58" height="14" rx="3" fill="url(#hz)"/></svg>`;
const icoGauge = `<svg class="ico" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#e9eef4" stroke="#5b6779" stroke-width="2.5"/><path d="M15 15 L22 8" stroke="#1a2230" stroke-width="2.5" stroke-linecap="round"/></svg>`;
const icoLever = open => `<svg class="ico" width="40" height="58" viewBox="0 0 40 58" aria-hidden="true"><defs><pattern id="hz2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#1b1f27"/><rect width="4" height="8" fill="#f5c400"/></pattern></defs><rect x="2" y="1" width="36" height="8" rx="2" fill="url(#hz2)"/><rect x="9" y="12" width="22" height="44" rx="5" fill="#0d131c"/><rect x="12" y="${open ? 15 : 37}" width="16" height="16" rx="4" fill="#c7d0dc"/></svg>`;

/* ---------- manual ---------- */
function manualHTML(lv){
  const L = CONFIG.levels[lv];
  const eng = L.bulletins;
  const max = L.maxStrikes;
  const code = t => `<span class="code">${t}</span>`;
  const rows = arr => arr.map(r => `<tr>${r.map((c, i) => (i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`)).join("")}</tr>`).join("");

  const terms = `<div class="tablewrap"><table class="terms">${[
    ["hot wire", icoWire("red") + icoWire("yellow"), "red or yellow"],
    ["cold wire", icoWire("blue") + icoWire("white"), "blue or white"],
    ["neutral wire", icoWire("black"), "black"],
    ["marked wire", icoWire("blue", true), "has stripes"],
    ["plain wire", icoWire("blue"), "no stripes"],
    ["run a diagnostic", icoTest, "the operator presses TEST"],
    ["pulses", icoLight(true) + icoLight(false), "the light next to TEST goes on and off"],
    ["steady", icoLight(true), "the light next to TEST stays on"]
  ].map(([a, b, c]) => `<tr><th>${a}</th><td class="pic">${b}</td><td>${c}</td></tr>`).join("")}</table></div>`;

  const wireTable = id => {
    const T = WIRE_TABLES[id];
    return `<div class="tablewrap"><table>
      <tr><th rowspan="2">${T.rowHead}</th><th colspan="${T.cols.length}">${T.colHead}</th></tr>
      <tr>${T.cols.map(c => `<th>${c}</th>`).join("")}</tr>
      ${["hot", "cold", "neutral"].map(r => `<tr><th>${r}</th>${T.cells[r].map(x => `<td class="cell">${x}</td>`).join("")}</tr>`).join("")}
    </table></div>`;
  };
  const instructions = `<div class="tablewrap"><table>
    ${Object.entries(INSTR).map(([k, v]) => `<tr><td class="cell">${k}</td><td>${v.t}</td></tr>`).join("")}
    <tr><td colspan="2"><b>first</b> = closest to the top &nbsp;&nbsp;|&nbsp;&nbsp; <b>last</b> = closest to the bottom</td></tr>
  </table></div>`;
  const regTable = `<div class="tablewrap"><table>
    <tr><th>Indicator light</th>${L.regUnits.map(u => `<th>${code(u)}</th>`).join("")}</tr>
    ${Object.keys(LAMP_COLOURS).map(c => `<tr><th>${c}</th>${L.regUnits.map(u => `<td class="cell">${REG_UNITS[u].patterns[c].split("").join(" ")}</td>`).join("")}</tr>`).join("")}
  </table></div>`;

  const units = [
    ...L.wireUnits.map(u => [u, "Wire unit", "4"]),
    ...L.regUnits.map(u => [u, "Flow regulator", "5"]),
    ["C-9", "Access lock", "6"],
    ["V-2", "Coolant valve – VEGA reactors only", "7"]
  ];
  if (eng) units.push(["M-5", "Magnetic clamp – ATLAS reactors only", "8"]);
  units.sort((a, b) => a[0].localeCompare(b[0]));

  const toc = [["m1", "1 At a glance"], ["m2", "2 Unit index"]];
  if (eng) toc.push(["m3", "3 Terms"]);
  toc.push(["m4", "4 Wire unit"], ["m5", "5 Flow regulator"], ["m6", "6 Access lock"], ["m7", "7 Coolant valve"]);
  if (eng) toc.push(["m8", "8 Magnetic clamp"], ["m9", "9 Service bulletins"]);
  else toc.push(["mg", "Glossary"]);

  let h = `<article class="manual">
  <h1>Reactor Stabilisation Manual</h1>
  <p class="edition">${L.name} edition – ${eng ? "HELIOS and ORION reactors" : "HELIOS reactors"}</p>
  <nav class="toc" aria-label="Contents">${toc.map(([id, t]) => `<a href="#${id}">${t}</a>`).join("")}</nav>

  <h2 id="m1">1 &nbsp;At a glance</h2>
  <div class="tablewrap"><table>${rows([
    ["You", "You can't see the reactor. The operator can, but has no manual."],
    ["Unit codes", `Every unit has a code, e.g. ${code("X-00")}. Ask for the codes, then use the unit index (2).`],
    ["Errors", `After <b>${max} errors</b> – or when the time is up – the reactor explodes. A cut wire can't be repaired.`],
    ["Finished?", "The operator gets a stabilisation code. Type it in at the bottom of your screen."]
  ])}</table></div>

  <h2 id="m2">2 &nbsp;Unit index</h2>
  <div class="tablewrap"><table><tr><th>Code</th><th>Unit</th><th>Section</th></tr>
    ${units.map(([c, n, s]) => `<tr><td>${code(c)}</td><td>${n}</td><td>${s}</td></tr>`).join("")}</table></div>`;

  if (eng) h += `
  <h2 id="m3">3 &nbsp;Terms</h2>${terms}`;

  const kTables = eng ? `Table ${code("K-12")} (4.2) or Table ${code("K-40")} (4.3), depending on the unit code` : `Table ${code("K-12")} (4.2)`;
  const wireSteps = [
    ["Goal", "Cut exactly <b>one</b> wire. Any other wire = error."],
    ["How", `Find your instruction letter in ${kTables}. Then follow that instruction (4.1).`]
  ];
  if (eng) wireSteps.splice(1, 0, ["Before you start", "Check service bulletin <b>SB-04</b>!"]);
  h += `
  <h2 id="m4">4 &nbsp;Wire unit (${L.wireUnits.map(code).join(", ")})</h2>
  <div class="tablewrap"><table>${rows(wireSteps)}</table></div>
  <h3>4.1 &nbsp;Instructions</h3>${instructions}
  <h3>4.2 &nbsp;Table ${code("K-12")}</h3>${wireTable("K-12")}
  ${eng ? `<h3>4.3 &nbsp;Table ${code("K-40")}</h3>${wireTable("K-40")}` : `<h3>4.3 &nbsp;Terms</h3>${terms}`}`;

  const regSteps = [
    ["Goal", "Set every lever to <b>open</b> or <b>closed</b>."],
    ["Target pattern", "Find it in Table R (5.2). <b>1</b> = open, <b>0</b> = closed. 1st digit = lever 1, 2nd digit = lever 2, …"],
    ["Finished?", "The operator presses ENGAGE. One wrong lever = error."]
  ];
  if (eng) regSteps.splice(2, 0, ["Light pulses?", "See service bulletin <b>SB-11</b>."]);
  const regTerms = [
    ["open lever", icoLever(true), "The handle points <b>towards</b> the hazard marking."],
    ["closed lever", icoLever(false), "The handle points <b>away from</b> the hazard marking."],
    ["lever 1", icoGauge, "The lever next to the pressure gauge. Count on from there."],
    ["hazard marking", icoHazard, "Yellow and black stripes on the unit."]
  ];
  h += `
  <h2 id="m5">5 &nbsp;Flow regulator (${L.regUnits.map(code).join(", ")})</h2>
  <h3>5.1 &nbsp;Instructions</h3>
  <div class="tablewrap"><table>${rows(regSteps)}</table></div>
  <h3>5.2 &nbsp;Table R &nbsp;–&nbsp; Target patterns</h3>${regTable}
  <h3>5.3 &nbsp;Terms</h3>
  <div class="tablewrap"><table class="terms">${regTerms.map(([x, y, z]) => `<tr><th>${x}</th><td class="pic">${y}</td><td>${z}</td></tr>`).join("")}</table></div>

  <h2 id="m6">6 &nbsp;Access lock (${code("C-9")})</h2>
  <div class="tablewrap"><table><tr><th>Digit</th><th>How to find it</th></tr>
    ${CODE_RULES[lv].map((r, i) => `<tr><td class="cell">${i + 1}</td><td>${r.t}</td></tr>`).join("")}
    <tr><td colspan="2">The operator types in all four digits and presses ENT. Wrong code = error.</td></tr></table></div>`;

  if (eng){
    h += `
  <div class="pair">
    <div><h3>Table A &nbsp;–&nbsp; Models</h3>
    <table><tr><th>Model</th><th>Digit</th></tr>${Object.entries(MODEL_TABLE).map(([m, v]) => `<tr><td class="code">${m.toUpperCase()}</td><td>${v}</td></tr>`).join("")}</table></div>
    <div><h3>Table B &nbsp;–&nbsp; Letters</h3>
    <table><tr><th>First letter</th><th>Digit</th></tr>
      <tr><td>A – F</td><td>4</td></tr><tr><td>G – M</td><td>7</td></tr><tr><td>N – T</td><td>2</td></tr><tr><td>U – Z</td><td>9</td></tr></table></div>
  </div>`;
  } else {
    h += `
  <h3>Table C &nbsp;–&nbsp; Indicator light</h3>
  <table><tr><th>Colour</th><th>Digit</th></tr>${Object.entries(COLOUR_TABLE).map(([c, v]) => `<tr><td>${c}</td><td>${v}</td></tr>`).join("")}</table>`;
  }

  h += `
  <h2 id="m7">7 &nbsp;Coolant valve (${code("V-2")})</h2>
  <div class="tablewrap"><table>${rows([
    ["Installed in", "VEGA reactors only"],
    ["Before you open it", "The coolant pressure must be below 40 bar."],
    ["Coolant level below ¼", "Refill the tank with blue coolant first."]
  ])}</table></div>`;

  if (eng){
    h += `
  <h2 id="m8">8 &nbsp;Magnetic clamp (${code("M-5")})</h2>
  <div class="tablewrap"><table>${rows([
    ["Installed in", "ATLAS reactors only"],
    ["Warning", "If the clamp were released during operation, the core would lose its magnetic field."],
    ["Release", "Only when the reactor has been switched off for at least ten minutes."]
  ])}</table></div>

  <h2 id="m9">9 &nbsp;Service bulletins</h2>
  <p>A bulletin replaces the normal rules when it applies to your reactor.</p>
  <div class="tablewrap"><table><tr><th>No.</th><th>Applies to</th><th>What changes</th></tr>
    <tr><td class="code">SB-02</td><td>VEGA reactors that have been running for more than six hours</td><td>Never open coolant valve ${code("V-2")}.</td></tr>
    <tr><td class="code">SB-04</td><td>Reactors whose serial number contains the same digit more than once (e.g. KT4A<b>4</b>2)</td><td>The wire unit is upside down. In section 4, the <b>bottom</b> wire counts as the top wire, and the <b>top</b> wire counts as the bottom wire. “Above” means “below”, and “below” means “above”.</td></tr>
    <tr><td class="code">SB-11</td><td>Flow regulators with a pulsing indicator light</td><td>Read the pattern from Table R backwards: the last digit is for lever 1.</td></tr>
  </table></div>`;
  } else {
    h += `
  <h2 id="mg">Glossary</h2>
  <table><tr><th>English</th><th>Deutsch</th></tr>${CONFIG.glossary.map(([e, g]) => `<tr><td>${e}</td><td>${g}</td></tr>`).join("")}</table>`;
  }
  return h + `</article>`;
}

}
function newgame(){
  const items = Object.entries(CONFIG.levels).map(([n, lv]) =>
    `<button class="level" data-act="level" data-level="${n}"><span class="badge">${esc(lv.name.toUpperCase())}</span><span><b>${Math.round(lv.seconds / 60)} minutes per reactor</b><small>${esc(lv.info)}</small></span></button>`).join("");
  $app.innerHTML = `<main class="wrap center"><h1 class="roundno">Choose a level</h1><div class="levels">${items}</div>
    <div class="stack"><button class="linkbtn" data-act="home">Back</button></div></main>`;
}
function codeScreen(){
  $app.innerHTML = `<main class="wrap center"><p class="lead">Your game code</p><div class="bigcode">${S.code}</div>
    <p class="lead">Tell your partner this code. They tap <b>Join a game</b> and type it in.<br>You are <b>Player 1</b>.</p>
    <div class="stack"><button class="btn" data-act="toIntro">We're ready</button><button class="linkbtn" data-act="home">Back</button></div></main>`;
}
function join(){
  $app.innerHTML = `<main class="wrap center"><h1 class="roundno">Join a game</h1><p class="lead">Type in the code from your partner's screen.</p>
    <div style="margin-top:20px"><input id="codein" class="codeinput" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Game code"></div>
    <p class="error" id="err"></p>
    <div class="stack"><button class="btn" data-act="doJoin">Join game</button><button class="linkbtn" data-act="home">Back</button></div></main>`;
  const inp = document.getElementById("codein");
  inp.focus();
  inp.addEventListener("keydown", e => { if (e.key === "Enter") doJoin(); });
}
function doJoin(){
  const raw = document.getElementById("codein").value.trim();
  const code = /^\d{4}$/.test(raw) ? parseInt(raw, 10) : NaN;
  if (!validCode(code)){ document.getElementById("err").textContent = "Check the code: it has 4 numbers and starts with 1 or 2."; return; }
  S = { ...fresh(), code, player: 2 };
  go("intro");
}
function intro(){
  const role = myRole();
  const text = role === "operator"
    ? `<h2>You are the operator</h2><p>You can see the reactor, but you don't have the manual.</p><p>Describe exactly what you see, answer your partner's questions and do what your partner says. Don't do anything on your own!</p><p>If anyone speaks German, tap <b>Oops, German!</b> – you lose ${CONFIG.germanPenaltySeconds} seconds.</p>`
    : `<h2>You are the expert</h2><p>You have the manual, but you can't see the reactor – and the manual doesn't show what the reactor looks like.</p><p>Ask your partner to describe the reactor, work out what to do and give clear instructions.</p><p>When the reactor is stable, your partner reads you a code. Type it in at the bottom of your screen.</p>`;
  $app.innerHTML = bar(false) + `<main class="wrap center"><p class="roundno">Reactor ${S.round} of ${CONFIG.roundsPerGame}</p>
    <div class="rolecard ${role}"><span class="role ${role}">Player ${S.player}</span>${text}</div>
    <div class="stack"><button class="btn" data-act="start">Start</button><p class="lead" style="margin:0">Start at the same time as your partner. Don't show your screen!</p></div></main>`;
}

/* --- play --- */
function play(){
  const d = makeReactor(S.code, S.round);
  R = { d, role: myRole(), cut: new Set(), sel: null, tested: false, lv: d.levers.slice(),
        solved: { wires: false, levers: false, code: false }, entry: "", strikes: 0, lastMistake: null,
        deadline: Date.now() + L().seconds * 1000, timer: null, ended: false };
  if (R.role === "operator") renderOperator(); else renderExpert();
  tick();
  R.timer = setInterval(tick, 250);
}
function wireSVG(){
  const d = R.d, n = d.wires.length, H = 26 + n * 46, W = 320;
  const strokes = (path, w) => {
    const col = WIRE_COLOURS[w.c], edge = w.c === "black" ? "#2a2f38" : "#0b0f16";
    const band = w.c === "white" || w.c === "yellow" ? "#1b1f27" : "#f4f6f9";
    let s = `<path d="${path}" stroke="${edge}" stroke-width="13" fill="none" stroke-linecap="round"/><path d="${path}" stroke="${col}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
    if (w.s) s += `<path d="${path}" stroke="${band}" stroke-width="9" fill="none" stroke-dasharray="4 8"/>`;
    return s;
  };
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${n} wires">`;
  d.wires.forEach((w, i) => {
    const y = 36 + i * 46;
    s += `<rect x="8" y="${y - 10}" width="18" height="20" rx="3" fill="#8b97a8"/><rect x="${W - 26}" y="${y - 10}" width="18" height="20" rx="3" fill="#8b97a8"/>`;
    const full = `M26 ${y} C 110 ${y - 16}, 210 ${y + 16}, ${W - 26} ${y}`;
    if (R.cut.has(i)){
      s += strokes(`M26 ${y} C 70 ${y - 10}, 120 ${y - 8}, 148 ${y + 4}`, w) + strokes(`M172 ${y - 4} C 205 ${y + 8}, 250 ${y + 10}, ${W - 26} ${y}`, w);
      s += `<circle cx="150" cy="${y + 4}" r="3" fill="#d9a066"/><circle cx="170" cy="${y - 4}" r="3" fill="#d9a066"/>`;
    } else {
      s += `<g data-act="wire" data-idx="${i}">`;
      if (R.sel === i) s += `<path d="${full}" stroke="#ffe066" stroke-opacity=".75" stroke-width="22" fill="none" stroke-linecap="round"/>`;
      s += strokes(full, w) + `<path d="${full}" stroke="transparent" stroke-width="40" fill="none"/></g>`;
    }
  });
  return s + `</svg>`;
}
function renderOperator(){
  const d = R.d, max = L().maxStrikes;
  const leds = Array.from({ length: max }, (_, i) => `<span class="led ${i < R.strikes ? "on" : ""}"></span>`).join("");
  const st = k => `<span class="st"><i></i>${R.solved[k] ? "STABLE" : "UNSTABLE"}</span>`;
  const levers = R.lv.map((u, i) => `<button class="lever ${u ? "up" : "down"}" data-act="lever" data-idx="${i}" aria-label="Lever ${u ? "up" : "down"}"></button>`).join("");
  const shown = (R.entry + "____").slice(0, 4);
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "CLR", "0", "ENT"].map(k =>
    `<button class="cbtn ${k === "ENT" ? "warn" : ""}" data-act="key" data-key="${k}">${k}</button>`).join("");
  $app.innerHTML = bar(false) + `<main class="wrap"><div class="console" id="console">
    <div class="hazard"></div>
    <div class="toprow">
      <div class="plate"><div class="lbl">MODEL</div><div class="model">${d.model.toUpperCase()}</div><div class="lbl" style="margin-top:4px">SERIAL NUMBER</div><div class="serial">${d.serial}</div></div>
      <div class="strikes"><span class="lbl">ERRORS</span><span class="leds">${leds}</span></div>
      <div class="clockbox"><span class="lbl">TIME LEFT</span><div class="clock" id="clock"></div></div>
    </div>
    <div class="modules">
      <section class="module ${R.solved.wires ? "stable" : ""}"><h3>UNIT <span class="unitcode">${d.wUnit}</span>${st("wires")}</h3>
        <div class="controls">
          <div class="wirebox">${wireSVG()}</div>
          <div class="row">
            <button class="cbtn" data-act="test">TEST</button><span class="testled ${R.tested ? d.test : ""}" aria-label="Test light"></span>
            <span class="grow"></span>
            <button class="cbtn warn" data-act="cutwire" ${R.sel === null ? "disabled" : ""}>✂ CUT</button>
          </div>
        </div>
      </section>
      <section class="module ${R.solved.levers ? "stable" : ""}"><h3>UNIT <span class="unitcode">${d.rUnit}</span>${st("levers")}</h3>
        <div class="controls">
          <div class="lamp ${d.pulse ? "pulse" : ""}" style="color:${LAMP_COLOURS[d.lamp]}" aria-label="Indicator"></div>
          <div class="bank ${d.stripe}">
            <div class="hazardbar"></div>
            <div class="bankrow ${d.gauge}"><div class="gauge" aria-label="Pressure gauge"><i></i></div><div class="levers">${levers}</div></div>
          </div>
          <div class="row"><span class="grow"></span><button class="cbtn warn" data-act="engage">ENGAGE</button></div>
        </div>
      </section>
      <section class="module ${R.solved.code ? "stable" : ""}"><h3>UNIT <span class="unitcode">C-9</span>${st("code")}</h3>
        <div class="controls"><div class="display">${shown}</div><div class="keypad">${keys}</div></div>
      </section>
    </div></div>
    <div class="actionbar">${keyStrip("operator")}
      <button class="btn secondary small" data-act="oops">Oops, German! (−${CONFIG.germanPenaltySeconds} s)</button>
    </div></main>`;
  tick();
}
function renderExpert(){
  $app.innerHTML = bar(true) + `<main class="wrap">${manualHTML(levelOf(S.code))}
    <div class="actionbar">${keyStrip("expert")}
      <div class="codeentry">
        <label for="ccode">Stabilisation code:</label>
        <input id="ccode" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off">
        <button class="btn small" data-act="checkcode">Check</button>
        <button class="btn secondary small" data-act="exploded">The reactor exploded</button>
      </div>
    </div></main>`;
  document.getElementById("ccode").addEventListener("keydown", e => { if (e.key === "Enter") checkCode(); });
}
function tick(){
  if (!R) return;
  const left = Math.max(0, Math.ceil((R.deadline - Date.now()) / 1000));
  const txt = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  for (const id of ["clock", "clockMini"]){
    const el = document.getElementById(id);
    if (el){ el.textContent = txt; el.classList.toggle("low", left <= 30); }
  }
  if (left <= 0 && R.role === "operator") explode("time");
}

function strike(mistake){
  R.strikes++; R.lastMistake = mistake;
  if (R.strikes >= L().maxStrikes){ explode("mistakes"); return; }
  renderOperator();
  const c = document.getElementById("console");
  if (c){ c.classList.remove("alarm"); void c.offsetWidth; c.classList.add("alarm"); }
  toast(`Wrong! Error ${R.strikes} of ${L().maxStrikes}. The reactor is getting hotter!`, "bad");
}
function checkAllSolved(){
  if (R.solved.wires && R.solved.levers && R.solved.code){
    R.ended = true; stopTimer();
    const stars = CONFIG.stars[Math.min(R.strikes, CONFIG.stars.length - 1)];
    S.results.push({ round: S.round, stars });
    S.last = { ok: true, stars, confirm: confirmCode(S.code, S.round, R.strikes), role: "operator" };
    go("result");
  } else renderOperator();
}
function explode(reason){
  if (!R || R.ended) return;
  R.ended = true; stopTimer();
  S.results.push({ round: S.round, stars: 0 });
  const sentence = reason === "time" || !R.lastMistake
    ? "If you had worked a little faster, the reactor wouldn't have exploded."
    : `If you had ${R.lastMistake}, the reactor would have survived.`;
  S.last = { ok: false, sentence, role: "operator" };
  go("result");
}
function onWire(i){ if (R.solved.wires || R.cut.has(i)) return; R.sel = R.sel === i ? null : i; renderOperator(); }
function cutWire(){
  if (R.sel === null || R.solved.wires) return;
  const i = R.sel; R.cut.add(i); R.sel = null;
  if (i === R.d.solution.wire){ R.solved.wires = true; toast(`Unit ${R.d.wUnit} stable!`, "good"); checkAllSolved(); }
  else strike(`cut the ${ORD[R.d.solution.wire]} wire from the top`);
}
function engage(){
  if (R.solved.levers) return;
  if (sameArr(R.lv, R.d.solution.levers)){ R.solved.levers = true; toast(`Unit ${R.d.rUnit} stable!`, "good"); checkAllSolved(); }
  else strike(`set the levers like this (from left to right: ${R.d.solution.levers.map(u => (u ? "up" : "down")).join(", ")})`);
}
function key(k){
  if (R.solved.code) return;
  if (k === "CLR"){ R.entry = ""; renderOperator(); return; }
  if (k === "ENT"){
    if (R.entry.length < 4){ toast("The code has four digits."); return; }
    if (R.entry === R.d.solution.code){ R.solved.code = true; toast("Unit C-9 stable!", "good"); checkAllSolved(); }
    else { R.entry = ""; strike(`entered the code ${R.d.solution.code.split("").join(" ")}`); }
    return;
  }
  if (R.entry.length < 4){ R.entry += k; renderOperator(); }
}
function checkCode(){
  const inp = document.getElementById("ccode");
  const v = parseInt(inp.value, 10);
  for (let s = 0; s < L().maxStrikes; s++){
    if (confirmCode(S.code, S.round, s) === v){
      R.ended = true; stopTimer();
      const stars = CONFIG.stars[Math.min(s, CONFIG.stars.length - 1)];
      S.results.push({ round: S.round, stars });
      S.last = { ok: true, stars, role: "expert" };
      go("result"); return;
    }
  }
  inp.value = "";
  toast("This code is not correct. Ask your partner to read it again.", "bad");
}
function expertExploded(){
  R.ended = true; stopTimer();
  S.results.push({ round: S.round, stars: 0 });
  S.last = { ok: false, role: "expert", sentence: "Ask your partner what went wrong. What would have happened if you had asked more questions?" };
  go("result");
}

function result(){
  const x = S.last || {};
  const lastRound = S.round >= CONFIG.roundsPerGame;
  const next = `<div class="stack"><button class="btn" data-act="next">${lastRound ? "See results" : "Next reactor"}</button></div>`;
  let body;
  if (x.ok && x.role === "operator"){
    body = `<p class="big good">Reactor stable!</p><div class="stars">${starText(x.stars)}</div>
      <p class="lead">Your stabilisation code:</p><div class="bigcode">${x.confirm}</div>
      <p class="lead">Read the code to your partner in English. Your partner types it in. Then go on together.</p>`;
  } else if (x.ok){
    body = `<p class="big good">Reactor stable!</p><div class="stars">${starText(x.stars)}</div><p class="lead">Well done, team. Now swap roles!</p>`;
  } else {
    body = `<div class="boom">KA-BOOM!</div><p class="lead">The reactor overloaded.</p><p class="type3">${esc(x.sentence)}</p>
      <p class="lead">${x.role === "operator" ? "Read this sentence to your partner. What went wrong?" : ""}</p>`;
  }
  $app.innerHTML = bar(false) + `<main class="wrap center">${body}${next}</main>`;
}
function nextRound(){ if (S.round >= CONFIG.roundsPerGame){ go("final"); return; } S.round++; S.last = null; go("intro"); }
function final(){
  const total = S.results.reduce((a, r) => a + r.stars, 0);
  const rows = S.results.map(r => `<tr><td>Reactor ${r.round}</td><td class="s">${"★".repeat(r.stars) || "exploded"}</td></tr>`).join("");
  $app.innerHTML = bar(false) + `<main class="wrap center"><p class="big">Mission over</p><p class="lead">Your team score:</p>
    <p class="total">${total} ★</p><table class="scoretable">${rows}</table>
    <div class="stack"><button class="btn" data-act="restart">Play again</button></div></main>`;
}

function openSheet(html, withClose = true){
  $sheet.innerHTML = `<div class="sheet" data-act="closeSheet"><div class="panel" role="dialog" aria-modal="true">${html}${withClose ? `<button class="btn secondary close" data-act="closeSheet">Close</button>` : ""}</div></div>`;
  $sheet.querySelector(".panel").addEventListener("click", e => { if (!e.target.closest('[data-act="closeSheet"]')) e.stopPropagation(); });
}
function howto(){
  openSheet(`<h2>How to play</h2><ol>
    <li>Player 1 starts a new game and tells Player 2 the code.</li>
    <li>Sit back to back. Never show your screen!</li>
    <li>The <b>operator</b> sees the reactor. The <b>expert</b> has the manual, but the manual doesn't show what the reactor looks like. Describe, ask, explain – and stabilise all three units.</li>
    <li>Wrong actions are errors. After ${CONFIG.levels[1].maxStrikes} errors – or when the time is up – the reactor explodes.</li>
    <li>When the reactor is stable, the operator reads the code to the expert. The expert types it in.</li>
    <li>Swap roles after every reactor. Speak English only!</li></ol>
    <p><b>Stars:</b> no errors ★★★ · one error ★★ · two errors ★</p>`);
}
let toastTimer = null;
function toast(msg, kind){
  let el = document.querySelector(".toast");
  if (!el){ el = document.createElement("div"); el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2200);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  switch (t.dataset.act){
    case "home": S = fresh(); save(); go("home"); break;
    case "new": go("newgame"); break;
    case "join": go("join"); break;
    case "level": { const lv = parseInt(t.dataset.level, 10); S = { ...fresh(), code: lv * 1000 + Math.floor(Math.random() * 1000), player: 1 }; go("code"); break; }
    case "toIntro": go("intro"); break;
    case "doJoin": doJoin(); break;
    case "start": go("play"); break;
    case "wire": onWire(+t.dataset.idx); break;
    case "cutwire": cutWire(); break;
    case "test": R.tested = true; renderOperator(); break;
    case "lever": if (!R.solved.levers){ const i = +t.dataset.idx; R.lv[i] = !R.lv[i]; renderOperator(); } break;
    case "engage": engage(); break;
    case "key": key(t.dataset.key); break;
    case "oops": R.deadline -= CONFIG.germanPenaltySeconds * 1000; tick(); toast(`−${CONFIG.germanPenaltySeconds} seconds – keep going in English!`, "bad"); break;
    case "checkcode": checkCode(); break;
    case "exploded":
      openSheet(`<h2>Did the reactor explode?</h2><p>Only tap “Yes” if your partner's screen says KA-BOOM.</p>
        <div class="btnrow"><button class="btn secondary" data-act="closeSheet">No, go back</button><button class="btn" data-act="confirmExploded">Yes, it exploded</button></div>`, false);
      break;
    case "confirmExploded": $sheet.innerHTML = ""; expertExploded(); break;
    case "next": nextRound(); break;
    case "restart": S = fresh(); save(); go("home"); break;
    case "howto": howto(); break;
    case "closeSheet": $sheet.innerHTML = ""; break;
    case "quit":
      openSheet(`<h2>Leave this game?</h2><p>Your stars will be lost.</p>
        <div class="btnrow"><button class="btn secondary" data-act="closeSheet">Stay in the game</button><button class="btn" data-act="doQuit">Leave game</button></div>`, false);
      break;
    case "doQuit": $sheet.innerHTML = ""; S = fresh(); save(); go("home"); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $sheet.innerHTML) $sheet.innerHTML = ""; });

render();
}
</script>
</body>
